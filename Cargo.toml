[package]
name = "crab-claw"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shellexpand = "3.1.2"
async-trait = "0.1.89"
tokio-util = { version = "0.7.18", features = ["join-map"] }
nanoid = "0.5.0"
serenity = "0.12.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-input = "0.15.3"
globset = "0.4.18"
chrono = "0.4.44"
