[package]
name = "crab-claw"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shellexpand = "3.1.2"
async-trait = "0.1.89"
tokio-util = { version = "0.7.18", features = ["join-map"] }
nanoid = "0.5.0"
